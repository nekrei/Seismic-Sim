<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Seismic Response – Three.js</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        /* Typography (spec 4, Part E): a deliberate system-only stack, no
           webfont network request (same "no new dependency" constraint as
           3D assets) -- replaces the untouched 'Segoe UI', system-ui
           default this project shipped with since spec 3. */
        body {
            overflow: hidden;
            background: #0b0b1a;
            color: rgba(255,255,255,0.85);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI Variable", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        canvas { display: block; }

        @keyframes panelSlideIn {
            from { opacity: 0; transform: translate(-14px, -8px); }
            to { opacity: 1; transform: translate(0, 0); }
        }

        /* ==================================================================
           Control panel (spec 4, Part E) -- ported near-verbatim from the
           approved mockup, claude_scripts/design-mockup-04.html: grouped
           <details> accordion sections instead of a flat list, a real
           mobile bottom-sheet reflow, and the typography scale below
           (headers ~14-15px/600, labels ~11px uppercase/500, values
           ~13px/400-500 with tabular-nums). Structural CSS unchanged from
           the mockup; only the demo-only #recomputeTrigger/.stage-note/
           .resize-hint/mood-board rules were left out (mockup-only, see
           claude_scripts/design-mockup-04.html's own comments).
           ================================================================== */
        #controls {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 10;
            background: rgba(11, 11, 26, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.08);
            color: rgba(255,255,255,0.7);
            display: flex;
            flex-direction: column;
            min-width: 240px;
            max-width: 300px;
            max-height: calc(100% - 40px);
            overflow-y: auto;
            user-select: none;
            animation: panelSlideIn 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        #controls:hover {
            border-color: rgba(255,215,100,0.18);
            box-shadow: 0 0 24px rgba(255,215,100,0.06);
        }

        /* Record block -- ungrouped, sits above the accordion */
        .record-block {
            padding: 14px 16px 12px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }

        .panel-header {
            font-size: 14px;
            font-weight: 600;
            color: rgba(255,255,255,0.85);
            letter-spacing: 0.01em;
        }
        .panel-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            font-weight: 600;
            font-family: ui-monospace, "SF Mono", "Cascadia Code", "Consolas", monospace;
            color: rgba(255, 224, 178, 0.55);
            min-width: 84px;
            flex-shrink: 0;
        }
        .panel-value {
            font-size: 13px;
            font-weight: 500;
            font-variant-numeric: tabular-nums;
            font-family: ui-monospace, "SF Mono", "Cascadia Code", monospace;
            color: rgba(255,255,255,0.75);
            min-width: 44px;
            flex-shrink: 0; /* numeric readouts are single unbreakable tokens
                                (e.g. "1000t") -- if squeezed below their own
                                content width they overflow the panel edge
                                instead of wrapping, so they must never be the
                                thing that gives up space to the slider */
            white-space: nowrap;
            text-align: right;
        }

        #controls select,
        #controls input[type="text"] {
            background: rgba(11, 11, 26, 0.9);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 6px;
            color: #fff;
            padding: 7px 8px;
            font-size: 13px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
            width: 100%;
        }
        #controls select option { background: #1a1a2e; color: #fff; }
        #controls select:hover, #controls select:focus { border-color: rgba(255,215,100,0.4); }

        /* accordion sections */
        #controls details {
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        #controls details:last-of-type { border-bottom: none; }
        #controls summary {
            list-style: none;
            cursor: pointer;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            -webkit-tap-highlight-color: transparent;
        }
        #controls summary::-webkit-details-marker { display: none; }
        #controls summary .chevron {
            font-size: 10px;
            color: rgba(255,255,255,0.35);
            transition: transform 0.2s ease;
        }
        #controls details[open] summary .chevron { transform: rotate(90deg); }
        #controls summary:hover .panel-header { color: #ffd764; }
        #controls .details-body {
            padding: 2px 16px 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        #controls .ctrl-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        /* Range-input styling applies to every slider in the panel --
           .ctrl-row (Building Parameters/Amplify/Floor), plus the
           Playback section's speed and seek sliders, which aren't inside a
           .ctrl-row -- kept as one shared ruleset so every slider in the
           panel looks/behaves identically (the mockup only wrote the
           .ctrl-row selector explicitly; extended here during the build
           pass, see the build report). */
        #controls .ctrl-row input[type="range"],
        #controls .transport-row .speed input[type="range"],
        #controls .seek-row input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            flex: 1;
            min-width: 0; /* flex items default to min-width:auto, which for a
                             range input resolves to its UA intrinsic width and
                             blocks real shrinking -- without this override the
                             slider refuses to compress and pushes the value
                             label off the panel edge instead */
            height: 4px;
            background: rgba(255,255,255,0.12);
            border: none;
            border-radius: 4px;
            padding: 0;
            cursor: pointer;
            accent-color: #ffd764;
        }
        #controls .ctrl-row input[type="range"]::-webkit-slider-thumb,
        #controls .transport-row .speed input[type="range"]::-webkit-slider-thumb,
        #controls .seek-row input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #ffd764;
            cursor: pointer;
            box-shadow: 0 0 8px rgba(255,215,100,0.35);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        #controls .ctrl-row input[type="range"]::-moz-range-thumb,
        #controls .transport-row .speed input[type="range"]::-moz-range-thumb,
        #controls .seek-row input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #ffd764;
            cursor: pointer;
            border: none;
        }
        #controls .ctrl-row input[type="range"]:hover::-webkit-slider-thumb,
        #controls .ctrl-row input[type="range"]:active::-webkit-slider-thumb,
        #controls .transport-row .speed input[type="range"]:hover::-webkit-slider-thumb,
        #controls .transport-row .speed input[type="range"]:active::-webkit-slider-thumb,
        #controls .seek-row input[type="range"]:hover::-webkit-slider-thumb,
        #controls .seek-row input[type="range"]:active::-webkit-slider-thumb {
            transform: scale(1.15);
            box-shadow: 0 0 14px rgba(255,215,100,0.65);
        }

        .transport-row { display: flex; gap: 8px; align-items: center; }
        .transport-row button {
            background: rgba(255,215,100,0.15);
            border: 1px solid rgba(255,215,100,0.2);
            color: #ffd764;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            transition: background 0.2s;
            min-height: 40px;
            min-width: 40px;
        }
        .transport-row button:hover { background: rgba(255,215,100,0.25); }
        .transport-row .speed { flex: 1; display: flex; align-items: center; gap: 8px; }

        .seek-row { display: flex; align-items: center; gap: 8px; }
        .seek-row .panel-value { min-width: 82px; }

        .intensity-track {
            flex: 1;
            height: 6px;
            border-radius: 4px;
            background: rgba(255,255,255,0.08);
            overflow: hidden;
        }
        .intensity-fill {
            height: 100%;
            width: 0%;
            border-radius: 4px;
            background: linear-gradient(90deg, #4ade80, #ffd764 55%, #ff5c5c);
            transition: width 0.08s linear;
            box-shadow: 0 0 6px currentColor;
        }

        .view-buttons { display: flex; gap: 8px; }
        .view-buttons button {
            flex: 1;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.12);
            color: rgba(255,255,255,0.75);
            padding: 9px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            min-height: 40px;
            transition: background 0.2s, border-color 0.2s;
        }
        .view-buttons button:hover { background: rgba(255,255,255,0.1); }
        .view-buttons button.primary {
            background: rgba(255,215,100,0.15);
            border-color: rgba(255,215,100,0.25);
            color: #ffd764;
        }
        .view-buttons button.primary:hover { background: rgba(255,215,100,0.25); }

        /* ---- mobile bottom-sheet reflow ---- */
        /* Collapsed strip: always visible, shows record name + play/pause.
           Expand affordance reveals the full accordion panel as a sheet
           sliding up from the bottom. */
        .sheet-collapsed-strip { display: none; }

        @media (max-width: 600px) {
            #controls {
                position: fixed;
                top: auto;
                bottom: 0;
                left: 0;
                right: 0;
                width: 100%;
                max-width: none;
                min-width: 0;
                border-radius: 16px 16px 0 0;
                max-height: 72%;
                transition: transform 0.28s cubic-bezier(0.16,1,0.3,1);
            }
            #controls.sheet-collapsed {
                transform: translateY(calc(100% - 56px));
            }
            .sheet-collapsed-strip {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 10px;
                padding: 0 14px;
                height: 56px;
                flex: none;
                cursor: pointer;
            }
            .sheet-collapsed-strip .record-name {
                font-size: 13px;
                font-weight: 600;
                color: rgba(255,255,255,0.85);
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            .sheet-collapsed-strip button {
                background: rgba(255,215,100,0.18);
                border: 1px solid rgba(255,215,100,0.25);
                color: #ffd764;
                border-radius: 8px;
                min-width: 40px;
                min-height: 40px;
                font-size: 16px;
                flex: none;
            }
            .sheet-expand-handle {
                width: 36px;
                height: 4px;
                border-radius: 4px;
                background: rgba(255,255,255,0.2);
                margin: 8px auto 0;
                flex: none;
            }
            .record-block { padding: 10px 16px 10px; }
            /* bump touch targets: thumbs 14->22px, buttons ~44px hit area */
            #controls .ctrl-row input[type="range"]::-webkit-slider-thumb,
            #controls .ctrl-row input[type="range"]::-moz-range-thumb,
            #controls .transport-row .speed input[type="range"]::-webkit-slider-thumb,
            #controls .transport-row .speed input[type="range"]::-moz-range-thumb,
            #controls .seek-row input[type="range"]::-webkit-slider-thumb,
            #controls .seek-row input[type="range"]::-moz-range-thumb {
                width: 22px;
                height: 22px;
            }
            #controls summary { padding: 14px 16px; min-height: 44px; }
            .transport-row button, .view-buttons button {
                min-height: 44px;
            }
            #info {
                font-size: 10px;
                padding: 4px 12px;
                bottom: 12px;
                white-space: normal;
            }
        }
        @media (max-width: 480px) {
            #controls { max-height: 78%; }
            .panel-label { min-width: 68px; font-size: 10.5px; letter-spacing: 0.05em; }
        }

        /* ==================================================================
           Live-recompute loading overlay (spec 4, Part H) -- replaces the
           old tiny "recomputing..." text line that lived in the Building
           Parameters section. Shown/hidden by liveRecompute() around its
           existing fetch (see the JS below), not by any UI trigger. Sits
           below #controls in the stacking order (z-index 5 vs 10) so the
           panel stays usable throughout. Ported near-verbatim from the
           approved mockup's .recompute-overlay/.recompute-floor/
           .recompute-label rules (claude_scripts/design-mockup-04.html) --
           only #recomputeTrigger (a mockup-only demo button) was left out.
           ================================================================== */
        .recompute-overlay {
            position: fixed;
            inset: 0;
            z-index: 5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            background: rgba(11,11,26,0.62);
            backdrop-filter: blur(3px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }
        .recompute-overlay.is-active { opacity: 1; }
        .recompute-stack {
            display: flex;
            flex-direction: column-reverse;
            gap: 6px;
        }
        .recompute-floor {
            width: 140px;
            height: 14px;
            border: 1.5px solid rgba(255,215,100,0.55);
            border-radius: 3px;
            background: rgba(255,215,100,0.06);
            opacity: 0;
            transform: translateY(10px) scaleX(0.85);
            animation: floorAssemble 1.5s ease-in-out infinite;
        }
        @keyframes floorAssemble {
            0%   { opacity: 0; transform: translateY(10px) scaleX(0.85); box-shadow: none; }
            18%  { opacity: 1; transform: translateY(0) scaleX(1); box-shadow: 0 0 10px rgba(255,215,100,0.4); }
            55%  { opacity: 1; transform: translateY(0) scaleX(1); box-shadow: none; }
            85%  { opacity: 0.12; }
            100% { opacity: 0; transform: translateY(10px) scaleX(0.85); }
        }
        .recompute-label {
            font-family: ui-monospace, "SF Mono", "Cascadia Code", monospace;
            font-size: 12px;
            letter-spacing: 0.16em;
            color: rgba(255,215,100,0.85);
            text-transform: uppercase;
        }
        .recompute-label .dots span {
            opacity: 0;
            animation: dotPulse 1.5s steps(1) infinite;
        }
        .recompute-label .dots span:nth-child(2) { animation-delay: 0.3s; }
        .recompute-label .dots span:nth-child(3) { animation-delay: 0.6s; }
        @keyframes dotPulse {
            0%, 20% { opacity: 0; }
            30%, 100% { opacity: 1; }
        }

        #info {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.3);
            font-size: 12px;
            background: rgba(0,0,0,0.4);
            padding: 6px 18px;
            border-radius: 30px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.04);
            user-select: none;
            pointer-events: none;
            white-space: nowrap;
        }
        #info span {
            color: rgba(255,215,100,0.5);
        }
        #progress {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 16px;
            background: rgba(0,0,0,0.7);
            padding: 12px 24px;
            border-radius: 12px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.06);
            display: none;
            z-index: 20;
            text-align: center;
            max-width: 80%;
        }
    </style>
</head>
<body>
    <!-- Live-recompute loading overlay (spec 4, Part H) -- shown/hidden by
         liveRecompute() around its fetch, see the module script below. -->
    <div class="recompute-overlay" id="recomputeOverlay">
        <div class="recompute-stack">
            <div class="recompute-floor" style="animation-delay:0.5s"></div>
            <div class="recompute-floor" style="animation-delay:0.4s"></div>
            <div class="recompute-floor" style="animation-delay:0.3s"></div>
            <div class="recompute-floor" style="animation-delay:0.2s"></div>
            <div class="recompute-floor" style="animation-delay:0.1s"></div>
            <div class="recompute-floor" style="animation-delay:0s"></div>
        </div>
        <div class="recompute-label">Recomputing<span class="dots"><span>.</span><span>.</span><span>.</span></span></div>
    </div>

    <div id="controls">
        <!-- Collapsed strip: only shown/used under the mobile bottom-sheet
             breakpoint (spec 4, Part E) -- mirrors the record name + a
             play/pause button so playback stays reachable without
             expanding the full sheet. -->
        <div class="sheet-collapsed-strip" id="sheetStrip">
            <span class="record-name" id="stripRecordName">—</span>
            <button id="stripPlayBtn">⏸</button>
        </div>
        <div class="sheet-expand-handle"></div>

        <!-- Record: ungrouped, top -->
        <div class="record-block">
            <div class="panel-label" style="margin-bottom:6px;">📍 Earthquake Record</div>
            <select id="folderSelect">
                <option value="">— loading… —</option>
            </select>
        </div>

        <!-- Playback: open by default -->
        <details open>
            <summary>
                <span class="panel-header">Playback</span>
                <span class="chevron">▶</span>
            </summary>
            <div class="details-body">
                <div class="transport-row">
                    <button id="playBtn">⏸</button>
                    <div class="speed">
                        <input type="range" id="speedSlider" min="0.1" max="5" step="0.1" value="1" />
                        <span class="panel-value" id="speedLabel">1.0×</span>
                    </div>
                </div>
                <div class="seek-row">
                    <input type="range" id="seekSlider" min="0" max="1" step="0.001" value="0" />
                    <span class="panel-value" id="timeDisplay">0.0s / 0.0s</span>
                </div>
                <div class="ctrl-row">
                    <span class="panel-label">Amplify</span>
                    <input type="range" id="amplifySlider" min="0" max="1000" step="1" value="0" />
                    <span class="panel-value" id="amplifyLabel">1×</span>
                </div>
                <div class="ctrl-row">
                    <span class="panel-label">Shaking</span>
                    <div class="intensity-track"><div class="intensity-fill" id="intensityFill"></div></div>
                </div>
            </div>
        </details>

        <!-- Building Parameters: collapsed by default -->
        <details>
            <summary>
                <span class="panel-header">Building Parameters</span>
                <span class="chevron">▶</span>
            </summary>
            <div class="details-body">
                <div class="ctrl-row">
                    <span class="panel-label">Stories</span>
                    <input type="range" id="storiesSlider" min="1" max="20" step="1" value="7" />
                    <span class="panel-value" id="storiesLabel">7</span>
                </div>
                <div class="ctrl-row">
                    <span class="panel-label">Mass/floor</span>
                    <input type="range" id="massSlider" min="100000" max="5000000" step="50000" value="1000000" />
                    <span class="panel-value" id="massLabel">1000t</span>
                </div>
                <div class="ctrl-row">
                    <span class="panel-label">Damping</span>
                    <input type="range" id="zetaSlider" min="0.01" max="0.2" step="0.005" value="0.05" />
                    <span class="panel-value" id="zetaLabel">5%</span>
                </div>
                <div class="ctrl-row">
                    <span class="panel-label">Column X</span>
                    <input type="range" id="columnXSlider" min="0.30" max="1.50" step="0.05" value="1.10" />
                    <span class="panel-value" id="columnXLabel">1.10m</span>
                </div>
                <div class="ctrl-row">
                    <span class="panel-label">Column Y</span>
                    <input type="range" id="columnYSlider" min="0.30" max="1.50" step="0.05" value="1.10" />
                    <span class="panel-value" id="columnYLabel">1.10m</span>
                </div>
                <div class="ctrl-row">
                    <span class="panel-label">Beam</span>
                    <input type="range" id="beamSlider" min="0.30" max="2.50" step="0.05" value="1.50" />
                    <span class="panel-value" id="beamLabel">1.50m</span>
                </div>
                <!-- Target Period is gone (spec 5): once k comes from real
                     column/beam dimensions, period is an OUTPUT of the
                     model, not an input -- a slider here would either
                     silently do nothing or fight the dimension sliders for
                     control of the same number. Read-only instead, makes
                     that "period is now an output" argument legible rather
                     than just an absence. -->
                <div class="ctrl-row">
                    <span class="panel-label">T₁ (X/Y)</span>
                    <span class="panel-value" id="periodReadout" style="flex:1;">–</span>
                </div>
                <!-- The old tiny "recomputing..." text line lived here;
                     replaced by the viewport-level .recompute-overlay
                     above (spec 4, Part H), which now owns this signal on
                     its own -- keeping both would just be a duplicate,
                     weaker indicator next to a much clearer one. -->
            </div>
        </details>

        <!-- View: new, per Part B -- open by default -->
        <details open>
            <summary>
                <span class="panel-header">View</span>
                <span class="chevron">▶</span>
            </summary>
            <div class="details-body">
                <div class="ctrl-row">
                    <span class="panel-label">Floor</span>
                    <select id="floorSelect" style="flex:1;">
                        <option value="full">Full building</option>
                    </select>
                </div>
                <div class="view-buttons">
                    <button class="primary" id="backToFullViewBtn">⤢ Back to full view</button>
                </div>
            </div>
        </details>
    </div>

    <div id="info">🏗️ <span>seismic response</span> · drag to orbit · scroll to zoom</div>
    <div id="progress">⏳ loading data…</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

        // DOM
        const folderSelect = document.getElementById('folderSelect');
        const playBtn = document.getElementById('playBtn');
        const speedSlider = document.getElementById('speedSlider');
        const speedLabel = document.getElementById('speedLabel');
        const amplifySlider = document.getElementById('amplifySlider');
        const amplifyLabel = document.getElementById('amplifyLabel');
        const seekSlider = document.getElementById('seekSlider');
        const timeDisplay = document.getElementById('timeDisplay');
        const progressEl = document.getElementById('progress');
        const intensityFill = document.getElementById('intensityFill');
        const storiesSlider = document.getElementById('storiesSlider');
        const storiesLabel = document.getElementById('storiesLabel');
        const massSlider = document.getElementById('massSlider');
        const massLabel = document.getElementById('massLabel');
        const zetaSlider = document.getElementById('zetaSlider');
        const zetaLabel = document.getElementById('zetaLabel');
        const columnXSlider = document.getElementById('columnXSlider');
        const columnXLabel = document.getElementById('columnXLabel');
        const columnYSlider = document.getElementById('columnYSlider');
        const columnYLabel = document.getElementById('columnYLabel');
        const beamSlider = document.getElementById('beamSlider');
        const beamLabel = document.getElementById('beamLabel');

        // --- Static Ground (fixed reference) ---

        // --- State ---

        // --- Amplify: logarithmic slider mapping ---
        // Real sway magnitude varies ~500x across real earthquake records
        // (sub-mm for a small quake to hundreds of mm for a near-fault
        // record) -- a single fixed linear range can't serve both ends, so
        // the slider's raw position (0-1000) maps logarithmically onto the
        // actual amplify value (AMPLIFY_MIN..AMPLIFY_MAX), and the default
        // is auto-computed per record (see loadFolderData) instead of

        const AMPLIFY_MIN = 1;
        const AMPLIFY_MAX = 3000;
        const AMPLIFY_SLIDER_MAX = 1000;
        // Target: at the auto-computed default, the tallest sway on screen
        // should be about this fraction of one story's height.
        const TARGET_SWAY_FRACTION = 0.175;

        function sliderPosToAmplify(pos) {
            const t = Math.max(0, Math.min(1, pos / AMPLIFY_SLIDER_MAX));
            return AMPLIFY_MIN * Math.pow(AMPLIFY_MAX / AMPLIFY_MIN, t);
        }

        function amplifyToSliderPos(amp) {
            const clamped = Math.max(AMPLIFY_MIN, Math.min(AMPLIFY_MAX, amp));
            const t = Math.log(clamped / AMPLIFY_MIN) / Math.log(AMPLIFY_MAX / AMPLIFY_MIN);
            return Math.round(t * AMPLIFY_SLIDER_MAX);
        }

        function setAmplify(amp) {
            amplify = Math.max(AMPLIFY_MIN, Math.min(AMPLIFY_MAX, amp));

        // --- Furniture templates (spec 5, Part B4) -- plain procedural

        // default 2.8x2.0 footprint / 3.5-unit floor height -- purely
        // cosmetic, independent of the physical furniture-class constants
        // (FURNITURE_CLASSES in mdof_response.py) that drive the SWAY.
