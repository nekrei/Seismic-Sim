        const FURNITURE_TEMPLATES = {
            table: buildTableTemplate(),
            chair: buildChairTemplate(),
            fan: buildFanTemplate(),
        };

        // --- Frequency-domain spectrum helpers (spec 6, frequency-domain
        // panel) -- hand-rolled radix-2 FFT rather than pulling in a
        // library. This project's course context (AGENTS.md) is why: the
        // whole point of the drawer these feed is to make the DFT/FFT
        // machinery this project already runs *visible*, not just call a
        // black box that happens to compute it. The Python side gets
        // scipy.fft "for free" since scipy is a real, load-bearing
        // dependency there already (mdof_response.py's physics) -- hand-
        // rolling it there too would just be duplication, not a
        // demonstration. This block is checked bit-for-bit against
        // scipy.fft by claude_scripts/fft_check.mjs + fft_check_scipy.py,
        // which extract it verbatim from between the sentinel comments
        // below at test time (never hold their own copy of the algorithm --
        // a copy could silently drift from this file and pass anyway).
        // Keep the block between the sentinels self-contained (no DOM/
        // three.js references) so that extraction keeps working.
        // ---8<--- SPECTRUM-HELPERS-BEGIN (extracted verbatim by claude_scripts/fft_check.mjs)
        function nextPow2(n) {
            let p = 1;
            while (p < n) p <<= 1;
            return p;
        }

        // In-place iterative radix-2 Cooley-Tukey, decimation-in-time.
        // `re`/`im` must be same-length Float64Arrays with length a power
        // of two. Forward transform, unnormalized (no 1/N), standard sign
        // convention matching numpy/scipy: X[k] = sum_n x[n]*exp(-2pi*i*k*n/N).
        function fftRadix2(re, im) {
            const n = re.length;
            // Bit-reversal permutation.
            for (let i = 1, j = 0; i < n; i++) {
                let bit = n >> 1;
                for (; j & bit; bit >>= 1) j ^= bit;
                j ^= bit;
                if (i < j) {
                    [re[i], re[j]] = [re[j], re[i]];
                    [im[i], im[j]] = [im[j], im[i]];
                }
            }
            // Iterative butterflies, doubling stage length each pass.
            for (let len = 2; len <= n; len <<= 1) {
                const half = len >> 1;
                const ang = -2 * Math.PI / len; // negative: forward transform
                const wRe = Math.cos(ang), wIm = Math.sin(ang);
                for (let i = 0; i < n; i += len) {
                    let curRe = 1, curIm = 0;
                    for (let j = 0; j < half; j++) {
                        const aRe = re[i + j], aIm = im[i + j];
                        const bRe0 = re[i + j + half], bIm0 = im[i + j + half];
                        const bRe = bRe0 * curRe - bIm0 * curIm;
                        const bIm = bRe0 * curIm + bIm0 * curRe;
                        re[i + j] = aRe + bRe;
                        im[i + j] = aIm + bIm;
                        re[i + j + half] = aRe - bRe;
                        im[i + j + half] = aIm - bIm;
                        const nextRe = curRe * wRe - curIm * wIm;
                        const nextIm = curRe * wIm + curIm * wRe;
                        curRe = nextRe;
                        curIm = nextIm;
                    }
                }
            }
        }

        // Geometric (log-spaced) bin edges from fMin to nyquistHz,
        // nBins+1 edges for nBins bins -- matches mdof_response.py's
        // np.geomspace(fMin, nyquist, nBins+1) bit-for-bit rule (see
        // spec 6 / claude_scripts/verify_spectrum.py).
        function logBinEdges(nyquistHz, fMin = 0.1, nBins = 400) {
            const edges = new Float64Array(nBins + 1);
            const ratio = nyquistHz / fMin;
            for (let b = 0; b <= nBins; b++) {
                edges[b] = fMin * Math.pow(ratio, b / nBins);
            }
            return edges;
        }

        // Zero-pads `signal` to the next power of two, runs it through
        // fftRadix2, and reduces the raw linear-frequency spectrum to
        // `nBins` log-spaced bins (geometric-mean bin centres). The `*dt`
        // on each magnitude turns the unnormalized DFT into an approximation
        // of the continuous Fourier transform, so the panel's absolute
        // values (not just their shape) are physically meaningful -- it
        // cancels out in the Output/Input ratio anyway, so it's free to keep.
        function logBinSpectrum(signal, dt, nBins = 400) {
            const fMin = 0.1;
            const nfft = nextPow2(signal.length);
            const re = new Float64Array(nfft);
            re.set(signal);
            const im = new Float64Array(nfft);
            fftRadix2(re, im);

            const half = nfft / 2; // inclusive -> half+1 raw bins
            const mag = new Float64Array(half + 1);
            const freq = new Float64Array(half + 1);
            for (let k = 0; k <= half; k++) {
                mag[k] = Math.hypot(re[k], im[k]) * dt;
                freq[k] = k / (nfft * dt);
            }

            const nyquist = 1 / (2 * dt);
            const edges = logBinEdges(nyquist, fMin, nBins);
            const fHz = new Float64Array(nBins);
            const magBinned = new Float64Array(nBins);
            for (let b = 0; b < nBins; b++) {
                fHz[b] = Math.sqrt(edges[b] * edges[b + 1]);
                const lo = edges[b], hi = edges[b + 1];
                const lastBin = b === nBins - 1; // inclusive on the right so freq === nyquist is captured
                let sum = 0, count = 0;
                for (let k = 0; k <= half; k++) {
                    const f = freq[k];
                    if (f >= lo && (lastBin ? f <= hi : f < hi)) {
                        sum += mag[k];
                        count++;
                    }
                }
                if (count > 0) {
                    magBinned[b] = sum / count;
                } else {
                    // Empty bin -- common at the log-spaced low end, where
                    // the bin is narrower than the FFT's linear spacing
                    // df = 1/(NFFT*dt). Fall back to the single nearest
                    // raw bin rather than interpolating, zero-filling, or
                    // leaving a NaN.
                    let bestK = 0, bestDist = Infinity;
                    for (let k = 0; k <= half; k++) {
                        const dist = Math.abs(freq[k] - fHz[b]);
                        if (dist < bestDist) {
                            bestDist = dist;
                            bestK = k;
                        }
                    }
                    magBinned[b] = mag[bestK];
                }
            }
            return { fHz, mag: magBinned };
        }
        // ---8<--- SPECTRUM-HELPERS-END

        // --- Deterministic per-floor furniture placement (spec B4) -- seeded
        // from (record name, floor index) so out/ regeneration never causes
        // spurious placement churn, and switching records/params reshuffles
        // furniture in a reproducible way rather than randomly every load. ---
        function hashSeed(str) {
            let h = 2166136261 >>> 0;
            for (let i = 0; i < str.length; i++) {
                h ^= str.charCodeAt(i);
                h = Math.imul(h, 16777619);
            }
            return h >>> 0;
        }
        function mulberry32(seed) {
            let a = seed >>> 0;
            return function () {
                a |= 0; a = (a + 0x6D2B79F5) | 0;
                let t = Math.imul(a ^ (a >>> 15), 1 | a);
                t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
                return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
            };
        }

        // Fixed clearance (scene units) around the footprint edge -- large
        // enough to clear a corner column at the MAXIMUM column-depth
        // slider value, so furniture placement never needs to react to the
        // current slider position to stay clear of the columns (spec C3's
        // open cutaway skips walls, but not the actual structural columns).
        // Widened slightly (0.45 -> 0.55, spec 4 Part A) alongside the
        // FURNITURE_SCALE bump above -- a bigger footprint plus rotation
        // could otherwise poke into a neighboring cell.
        const FURNITURE_MARGIN = 0.55;
        const FURNITURE_GRID = 3; // 3x3 -> ~9 items/floor (spec B4)
        // Jitter multiplier reduced (0.5 -> 0.3, spec 4 Part A) for the same
        // reason -- per the spec, overlap risk from the size bump is fixed
        // by tightening placement, never by shrinking FURNITURE_SCALE back
        // down.
        const FURNITURE_JITTER = 0.3;

        // Per-instance material tint jitter (spec 4, Part F) -- reuses the
        // existing hashSeed()/mulberry32() PRNG (no new one), seeded per
        // instance so re-placing furniture on `out/` regeneration is still
        // reproducible. +/-4% brightness offset, applied to a cloned
        // material (templates are shared across instances via .clone(true),
        // but clone(true) shares the material reference by default -- so
        // each instance needs its own material clone before tinting it,
        // otherwise every instance of a class would flash the same random
        // tint together).
        const FURNITURE_TINT_JITTER = 0.04;
        function applyFurnitureTint(mesh, rand) {
            mesh.traverse((node) => {
                if (!node.isMesh || !node.material) return;
                const mat = node.material.clone();
                const factor = 1 + (rand() * 2 - 1) * FURNITURE_TINT_JITTER;
                mat.color.multiplyScalar(factor);
                node.material = mat;
            });
        }

        function placeFurnitureForFloor(recordName, floorIndex, floorGroup, width, depth, slabTop) {
            const seed = hashSeed(`${recordName}#${floorIndex}`);
            const rand = mulberry32(seed);
            const innerW = Math.max(0.2, width - 2 * FURNITURE_MARGIN);
            const innerD = Math.max(0.2, depth - 2 * FURNITURE_MARGIN);
            const cellW = innerW / FURNITURE_GRID;
            const cellD = innerD / FURNITURE_GRID;
            const items = [];
            let classCursor = Math.floor(rand() * FURNITURE_CLASS_NAMES.length);
            for (let r = 0; r < FURNITURE_GRID; r++) {
                for (let c = 0; c < FURNITURE_GRID; c++) {
                    const cx = -innerW / 2 + (c + 0.5) * cellW;
                    const cz = -innerD / 2 + (r + 0.5) * cellD;
                    const baseX = cx + (rand() - 0.5) * cellW * FURNITURE_JITTER;
                    const baseZ = cz + (rand() - 0.5) * cellD * FURNITURE_JITTER;
                    const className = FURNITURE_CLASS_NAMES[classCursor % FURNITURE_CLASS_NAMES.length];
                    classCursor++;
                    const mesh = FURNITURE_TEMPLATES[className].clone(true);
                    mesh.rotation.y = rand() * Math.PI * 2;
                    mesh.position.set(baseX, slabTop, baseZ);
                    applyFurnitureTint(mesh, rand);
                    floorGroup.add(mesh);
                    items.push({ mesh, floorIndex, className, baseX, baseZ });
                }
            }
            return items;
        }

        const UP_VECTOR = new THREE.Vector3(0, 1, 0);
        const _dirVec = new THREE.Vector3();

        // --- Building creation (spec 5, Part A/C -- open-cutaway frame) ---
        // Structure: opaque thin floor SLABS (furniture needs something to
        // visibly sit on) plus perimeter BEAMS, both grouped per floor and
        // moving rigidly with that floor's computed displacement; COLUMNS
        // live at scene top level (not inside a floor group), since a
        // column spans two DIFFERENTLY displaced levels -- each column's
        // transform is derived every frame from its bottom/top floor-group
        // positions (see updateColumnTransforms()). `frame` carries the
        // physical column/beam dimensions and plan span (from
        // building_data.json or /compute's header); `folderName` seeds
        // furniture placement.
        function createBuilding(numFloors, floorHeight, frame, folderName) {
            for (const obj of sceneObjects) scene.remove(obj);
            sceneObjects = [];
            buildingGroups = [];
            columnMeshes = [];
            furnitureItems = [];

            const groups = [];
            const width = 2.8,
                depth = 2.0,
                gap = 0.04,
                floorH = floorHeight;
            const colorBottom = new THREE.Color(0xc47a5a);
            const colorTop = new THREE.Color(0x7ab8d4);

            // Column/beam render thickness derives from the REAL physical
            // dimensions via the same plan-to-scene ratio the footprint
            // already uses (width/depth are fixed scene units representing
            // PLAN_SPAN_X/Y at roughly 1:3), times a named cosmetic
            // exaggeration constant -- spec C1 explicitly permits
            // stylized-for-visibility scaling, not true-to-scale (members
            // this thin at a literal 1:3 scale would be a couple of pixels
            // wide and effectively invisible).
            const sceneScaleX = width / frame.planSpanX;
            const sceneScaleZ = depth / frame.planSpanY;
            const memberScale = (sceneScaleX + sceneScaleZ) / 2;
            const FRAME_RENDER_EXAGGERATION = 1.3;
            const colThickX = frame.columnDepthX * sceneScaleX * FRAME_RENDER_EXAGGERATION;
            const colThickZ = frame.columnDepthY * sceneScaleZ * FRAME_RENDER_EXAGGERATION;
            const beamHeight = frame.beamDepth * memberScale * FRAME_RENDER_EXAGGERATION;
            const beamThick = frame.beamWidth * memberScale * FRAME_RENDER_EXAGGERATION;
            const slabThickness = 0.10;

            const corners = [
                [width / 2, depth / 2],
                [width / 2, -depth / 2],
                [-width / 2, depth / 2],
                [-width / 2, -depth / 2],
            ];

            const columnGeo = new THREE.BoxGeometry(1, 1, 1);
            const beamGeo = new THREE.BoxGeometry(1, 1, 1);
            const slabGeo = new THREE.BoxGeometry(width + 0.1, slabThickness, depth + 0.1);

            for (let f = 0; f < numFloors; f++) {
                const yPos = (f + 1) * (floorH + gap);
                const group = new THREE.Group();
                group.position.set(0, yPos, 0);
                scene.add(group);
                sceneObjects.push(group);
                groups.push(group);

                // numFloors===1 (min Stories slider value) makes this a
                // divide-by-zero (0/0 = NaN), which poisons every material
                // color derived from baseColor below -- NaN components
                // render as solid black in WebGL, so a 1-story building
                // came out as a plain black box instead of tinted like
                // every other floor count (spec 2's fix, preserved here).
                const t = numFloors > 1 ? f / (numFloors - 1) : 0.5;
                const baseColor = colorBottom.clone().lerp(colorTop, t);

                // Floor slab -- opaque, so furniture visibly sits on
                // something and floor levels still read clearly even with
                // the exterior walls gone (spec C3). Roughness/metalness
                // pushed toward a flatter "poured concrete" read (spec 4,
                // Part F) -- widens the gap against beams/columns below,
                // which previously clustered closely around 0.5/0.3-0.6/0.2.
                const slabMat = new THREE.MeshStandardMaterial({ color: baseColor.clone().multiplyScalar(0.9), roughness: 0.9, metalness: 0.05 });
                const slab = new THREE.Mesh(slabGeo, slabMat);
                slab.castShadow = true;
                slab.receiveShadow = true;
                group.add(slab);

                // Perimeter beams at this floor level (spec A2's 4 beams
                // per floor) -- front/back span X, left/right span Z.
                // roughness/metalness (spec 4, Part F): less "structural
                // dense" than columns, less flat than slabs.
                const beamMat = new THREE.MeshStandardMaterial({ color: baseColor.clone().multiplyScalar(1.05), roughness: 0.65, metalness: 0.15 });
                const beamY = -slabThickness / 2 - beamHeight / 2 - 0.01;

                const beamFront = new THREE.Mesh(beamGeo, beamMat);
                beamFront.scale.set(width, beamHeight, beamThick);
                beamFront.position.set(0, beamY, depth / 2);
                beamFront.castShadow = true;
                group.add(beamFront);

                const beamBack = beamFront.clone();
                beamBack.position.z = -depth / 2;
                group.add(beamBack);

                const beamLeft = new THREE.Mesh(beamGeo, beamMat);
                beamLeft.scale.set(beamThick, beamHeight, depth);
                beamLeft.position.set(width / 2, beamY, 0);
                beamLeft.castShadow = true;
                group.add(beamLeft);

                const beamRight = beamLeft.clone();
                beamRight.position.x = -width / 2;
                group.add(beamRight);

                // Furniture, parented to this floor group so it inherits
                // the floor's own rigid lateral sway "for free" -- only the
                // furniture's ADDITIONAL relative-sway offset (spec B) is
                // applied as a per-frame local-position tweak in
                // updateFurnitureOffsets(), on top of whatever base
                // position it's placed at here.
                const items = placeFurnitureForFloor(folderName || 'unknown', f, group, width, depth, slabThickness / 2 + 0.01);
                furnitureItems.push(...items);

                // Columns for the story BELOW this floor: story f+1, from
                // level f (floor f's group, or the ground when f===0) up to
                // level f+1 (this floor's group). Columns live at scene top
                // level, not as a child of either floor group -- see
                // updateColumnTransforms(). roughness/metalness pushed more
                // "structural/dense" (spec 4, Part F) vs. beams/slabs above.
                const colBaseColor = baseColor.clone().multiplyScalar(0.75);
                for (let cornerIndex = 0; cornerIndex < corners.length; cornerIndex++) {
                    const [cx, cz] = corners[cornerIndex];
                    // Deterministic per-column tint jitter (spec 4, Part F)
                    // -- reuses the existing hashSeed()/mulberry32() PRNG
                    // (no new one), seeded per (record, story, corner) so
                    // regenerating out/ never causes spurious re-tinting.
                    const colSeed = hashSeed(`${folderName || 'unknown'}#col#${f}#${cornerIndex}`);
                    const colRand = mulberry32(colSeed);
                    const tintFactor = 1 + (colRand() * 2 - 1) * 0.04; // +/-4%
                    const colMat = new THREE.MeshStandardMaterial({
                        color: colBaseColor.clone().multiplyScalar(tintFactor),
                        roughness: 0.45,
                        metalness: 0.25,
                    });
                    const mesh = new THREE.Mesh(columnGeo, colMat);
                    mesh.castShadow = true;
                    mesh.receiveShadow = true;
                    scene.add(mesh);
                    sceneObjects.push(mesh);
                    columnMeshes.push({
                        mesh,
                        cornerX: cx,
                        cornerZ: cz,
                        thicknessX: colThickX,
                        thicknessZ: colThickZ,
                        bottomSource: f === 0 ? { type: 'ground' } : { type: 'floor', index: f - 1 },
                        topSource: { type: 'floor', index: f },
                    });
                }
            }

            // Roof cap (decorative -- antenna + blinking light) rides as a
            // child of the topmost floor group, so it needs no separate
            // per-frame position update; it moves for free via the group's
            // own transform (simpler than the old standalone roof group
            // that had to re-derive the top floor's displacement itself).
            const topGroup = groups[groups.length - 1];
            const roofGeo = new THREE.BoxGeometry(width + 0.15, 0.1, depth + 0.15);
            const roofMat = new THREE.MeshStandardMaterial({ color: 0x6a7a9a, roughness: 0.3, metalness: 0.5, emissive: 0x223355, emissiveIntensity: 0.1 });
            const roofMesh = new THREE.Mesh(roofGeo, roofMat);
            roofMesh.position.y = slabThickness / 2 + 0.05;
            roofMesh.castShadow = true;
            roofMesh.receiveShadow = true;
            topGroup.add(roofMesh);

            const antGeo = new THREE.CylinderGeometry(0.03, 0.05, 0.4, 6);
            const antMat = new THREE.MeshStandardMaterial({ color: 0x8899bb, metalness: 0.7, roughness: 0.3 });
            const ant = new THREE.Mesh(antGeo, antMat);
            ant.position.set(0, slabThickness / 2 + 0.3, 0);
            ant.castShadow = true;
            topGroup.add(ant);

            const lightGeo = new THREE.SphereGeometry(0.05, 8, 8);
            const lightMat = new THREE.MeshStandardMaterial({ color: 0xff4444, emissive: 0xff2222, emissiveIntensity: 0.8 });
            const lightMesh = new THREE.Mesh(lightGeo, lightMat);
            lightMesh.position.set(0, slabThickness / 2 + 0.55, 0);
            topGroup.add(lightMesh);

            buildingGroups = groups;
            return { lightSphere: lightMesh, totalHeight: numFloors * (floorH + gap) };
        }

        // --- Per-frame column transform update -- a column's world
        // position/orientation/length are derived from its bottom and top
        // endpoints' CURRENT world positions (already updated for this
        // frame by the floor-group position loop in animate()), not stored
        // directly, since a column spans two independently-swaying levels. ---
        function sourceWorldPos(source) {
            if (source.type === 'ground') {
                return {
                    x: foundationSlab ? foundationSlab.position.x : 0,
                    y: 0,
                    z: foundationSlab ? foundationSlab.position.z : 0,
                };
            }
            const g = buildingGroups[source.index];
            return { x: g.position.x, y: g.position.y, z: g.position.z };
        }

        function updateColumnTransforms() {
            for (const c of columnMeshes) {
                const b = sourceWorldPos(c.bottomSource);
                const t = sourceWorldPos(c.topSource);
                const bx = b.x + c.cornerX, by = b.y, bz = b.z + c.cornerZ;
                const tx = t.x + c.cornerX, ty = t.y, tz = t.z + c.cornerZ;
                const dx = tx - bx, dy = ty - by, dz = tz - bz;
                const length = Math.sqrt(dx * dx + dy * dy + dz * dz) || 1e-6;
                c.mesh.position.set((bx + tx) / 2, (by + ty) / 2, (bz + tz) / 2);
                c.mesh.scale.set(c.thicknessX, length, c.thicknessZ);
                _dirVec.set(dx, dy, dz).normalize();
                c.mesh.quaternion.setFromUnitVectors(UP_VECTOR, _dirVec);
            }
        }

        // Caps the furniture's rendered relative-sway offset regardless of
        // Amplify (spec B4 / verification 7's "not wildly divergent"
        // guarantee) -- without this an untouched high Amplify value would
        // fling furniture through walls that no longer exist once the open
        // cutaway (C3) removed them.
        const FURNITURE_RENDER_CLAMP = 0.35;

        function updateFurnitureOffsets(tSeconds) {
            if (!furnitureItems.length || !furnitureData || furnitureRateHz <= 0) return;
            const fdt = 1 / furnitureRateHz;
            const fIdxFloat = Math.max(0, tSeconds) / fdt;
            const i0 = Math.floor(fIdxFloat);
            const frac = fIdxFloat - i0;

            for (const item of furnitureItems) {
                const seriesX = furnitureData.X?.[item.className]?.[item.floorIndex];
                const seriesZ = furnitureData.Y?.[item.className]?.[item.floorIndex];

                let ox = 0, oz = 0;
                if (seriesX && seriesX.length > 1) {
                    const n = seriesX.length;
                    ox = seriesX[Math.min(i0, n - 1)] * (1 - frac) + seriesX[Math.min(i0 + 1, n - 1)] * frac;
                }
                if (seriesZ && seriesZ.length > 1) {
                    const n = seriesZ.length;
                    oz = seriesZ[Math.min(i0, n - 1)] * (1 - frac) + seriesZ[Math.min(i0 + 1, n - 1)] * frac;
                }

                ox = Math.max(-FURNITURE_RENDER_CLAMP, Math.min(FURNITURE_RENDER_CLAMP, ox * amplify));
                oz = Math.max(-FURNITURE_RENDER_CLAMP, Math.min(FURNITURE_RENDER_CLAMP, oz * amplify));

                item.mesh.position.x = item.baseX + ox;
                item.mesh.position.z = item.baseZ + oz;
            }
        }

        // --- Create foundation slab (moves with ground) ---
        function createFoundationSlab() {
            if (foundationSlab) {
                scene.remove(foundationSlab);
                foundationSlab = null;
            }
            // Make it wider and thicker
            const slabWidth = 6.0;   // was 4.0
            const slabDepth = 5.0;   // was 3.0
            const slabHeight = 0.4;  // was 0.2
            const geo = new THREE.BoxGeometry(slabWidth, slabHeight, slabDepth);
            const mat = new THREE.MeshStandardMaterial({
                color: 0x4a4a6a, // slightly lighter to stand out
                roughness: 0.9,
                metalness: 0.1,
            });
            foundationSlab = new THREE.Mesh(geo, mat);
            // Position it so its top is at y=0 (ground level)
            foundationSlab.position.y = -slabHeight / 2;
            foundationSlab.receiveShadow = true;
            foundationSlab.castShadow = true;
            scene.add(foundationSlab);
            // Add to sceneObjects so it gets cleaned up when switching earthquake
            sceneObjects.push(foundationSlab);
            return foundationSlab;
        }

        // --- Furniture/frame data-plumbing helpers, shared by the static
        // out/ path (loadFolderData) and the live /compute path
        // (liveRecompute) -- neither should duplicate this parsing logic. ---

        // Slices a flat (classes*floors*npts_dec) Float32Array into
        // {className: [Float32Array per floor]}, matching the row-major
        // layout mdof_response.py/server.py write (class outer, floor
        // inner, both ahead of the sample axis).
        function sliceFurnitureAxis(flatArray, classNames, numFloors, nptsDec) {
            const out = {};
            let offset = 0;
            for (const cls of classNames) {
                const perFloor = [];
                for (let f = 0; f < numFloors; f++) {
                    perFloor.push(flatArray.subarray(offset, offset + nptsDec));
                    offset += nptsDec;
                }
                out[cls] = perFloor;
            }
            return out;
        }

        // Frame-geometry fields are defensively gated (fall back to the
        // JS-side defaults) since the separately-deployed backend
        // (seismic-sim-backend) may not have been mirrored yet with spec
        // 5's changes -- see AGENTS.md's standing mirror-sync rule. An
        // un-mirrored backend's /compute response simply won't have these
        // fields, and this project should degrade gracefully rather than
        // throw.
        function normalizeFrame(raw) {
            return {
                columnDepthX: raw?.column_depth_x ?? DEFAULT_COLUMN_DEPTH_X,
                columnDepthY: raw?.column_depth_y ?? DEFAULT_COLUMN_DEPTH_Y,
                beamDepth: raw?.beam_depth ?? DEFAULT_BEAM_DEPTH,
                beamWidth: raw?.beam_width ?? BEAM_WIDTH,
                planSpanX: raw?.plan_span_x ?? PLAN_SPAN_X,
                planSpanY: raw?.plan_span_y ?? PLAN_SPAN_Y,
            };
        }

        // --- Load data for a folder ---
        async function loadFolderData(folder) {
            if (!folder) return;
            progressEl.style.display = 'block';
            progressEl.textContent = `⏳ loading ${folder}…`;

            try {
                const metaUrl = `out/${folder}/building_data.json`;
                const metaRes = await fetch(metaUrl);
                if (!metaRes.ok) throw new Error(`Cannot load ${metaUrl} (${metaRes.status})`);
                const meta = await metaRes.json();
                const numStories = meta.num_stories;
                const storyHeight = meta.story_height;
                const frame = normalizeFrame(meta);

                // Furniture (spec 5, Part B) -- defensively gated on the
                // metadata actually advertising a furniture block/artifact,
                // and on the fetch succeeding, so a partially-regenerated
                // out/ (missing furniture_response.bin) degrades to "no
                // furniture sway" instead of a hard failure.
                let furniture = null;
                let furnitureRate = 0;
                if (meta.furniture && meta.furniture.artifact && meta.furniture.npts_decimated) {
                    try {
                        const binRes = await fetch(`out/${folder}/${meta.furniture.artifact}`);
                        if (binRes.ok) {
                            const flat = new Float32Array(await binRes.arrayBuffer());
                            const classNames = meta.furniture.classes || FURNITURE_CLASS_NAMES;
                            const nptsDec = meta.furniture.npts_decimated;
                            const perAxisLen = classNames.length * numStories * nptsDec;
                            furniture = {
                                X: sliceFurnitureAxis(flat.subarray(0, perAxisLen), classNames, numStories, nptsDec),
                                Y: sliceFurnitureAxis(flat.subarray(perAxisLen, perAxisLen * 2), classNames, numStories, nptsDec),
                            };
                            furnitureRate = meta.furniture.decimated_rate_hz || 0;
                        } else {
                            console.warn(`⚠️ Furniture data not found for ${folder} (${binRes.status}) -- rendering without furniture sway.`);
                        }
                    } catch (furnErr) {
                        console.warn('⚠️ Failed to load furniture data -- rendering without furniture sway.', furnErr);
                    }
                }

                const [xRes, yRes] = await Promise.all([
                    fetch(`out/${folder}/response_X.csv`),
                    fetch(`out/${folder}/response_Y.csv`)
                ]);
                if (!xRes.ok || !yRes.ok) throw new Error(`CSV files not found (X:${xRes.status}, Y:${yRes.status})`);

                const xText = await xRes.text();
                const yText = await yRes.text();

                function parseCSV(text) {
                    const lines = text.trim().split('\n');
                    const header = lines[0].split(',').map(s => s.trim());
                    const data = [];
                    for (let i = 1; i < lines.length; i++) {
                        const vals = lines[i].split(',').map(s => parseFloat(s.trim()));
                        if (vals.some(isNaN)) continue;
                        data.push(vals);
                    }
                    return { header, data };
                }

                const xParsed = parseCSV(xText);
                const yParsed = parseCSV(yText);

                const minLen = Math.min(xParsed.data.length, yParsed.data.length);
                xParsed.data = xParsed.data.slice(0, minLen);
                yParsed.data = yParsed.data.slice(0, minLen);

                const time = xParsed.data.map(row => row[0]);
                const groundX = xParsed.data.map(row => row[1]);
                const groundY = yParsed.data.map(row => row[1]);

                const floorX = [],
                    floorY = [];
                for (let f = 0; f < numStories; f++) {
                    const colX = 2 + f,
                        colY = 2 + f;
                    if (colX < xParsed.data[0].length && colY < yParsed.data[0].length) {
                        floorX.push(xParsed.data.map(row => row[colX]));
                        floorY.push(yParsed.data.map(row => row[colY]));
                    } else {
                        floorX.push(new Array(time.length).fill(0));
                        floorY.push(new Array(time.length).fill(0));
                    }
                }

                console.log(`📊 Ground X range: ${Math.min(...groundX).toFixed(4)} to ${Math.max(...groundX).toFixed(4)} m`);
                console.log(`📊 Ground Y range: ${Math.min(...groundY).toFixed(4)} to ${Math.max(...groundY).toFixed(4)} m`);

                applyLoadedData(numStories, storyHeight, time, groundX, groundY, floorX, floorY, {
                    frame,
                    furniture,
                    furnitureRate,
                    periodX: meta.fundamental_period_s_X ?? null,
                    periodY: meta.fundamental_period_s_Y ?? null,
                    recordName: folder,
                });
                progressEl.style.display = 'none';
                console.log(`✅ Loaded ${folder} (${numStories} floors, ${totalFrames} frames)`);
            } catch (err) {
                console.error('❌ Error loading folder:', err);
                progressEl.textContent = `❌ ${err.message}`;
                progressEl.style.color = '#ff6b6b';
                setTimeout(() => { progressEl.style.display = 'none'; }, 5000);
            }
        }

        // --- Frame the camera so the full building height fits on screen
        // from any orbit angle (including a pure side view), regardless of
        // how many stories it has. Distance is derived from the camera's
        // own vertical FOV instead of a fixed ratio, and controls.maxDistance
        // /camera.far are widened to match -- otherwise OrbitControls silently
        // clamps a tall building's required distance back down to the old
        // fixed 40-unit cap, cutting it off. Runs on every applyLoadedData
        // call (record switch AND live parameter recompute) since story
        // count changes the required distance too. ---
        function frameCameraToBuilding(totalHeight) {
            const vFov = camera.fov * Math.PI / 180;
            const margin = 1.35; // headroom so the roof/antenna isn't grazing the frame edge
            const footprint = 3.5; // half-diagonal of the building's plan (width/depth from createBuilding)

            const distForHeight = (totalHeight / 2 + 1) / Math.tan(vFov / 2) * margin;
            const hFov = 2 * Math.atan(Math.tan(vFov / 2) * camera.aspect);
            const distForWidth = footprint / Math.tan(hFov / 2) * margin;
            const dist = Math.max(distForHeight, distForWidth, 8);

            controls.maxDistance = Math.max(40, dist * 2.5);
            camera.far = Math.max(100, dist * 3);
            camera.updateProjectionMatrix();

            // scene.fog's fixed (30, 60) range was tuned for the ~50-unit
            // distance a 7-story default building needs -- at 20 stories
            // dist grows past 130, which the old fixed far-plane fully
            // fogs out to the background color before it ever reaches the
            // camera, making the whole building invisible even though it's
            // correctly inside the view frustum. Scale fog range with dist
            // (same 0.5 near/far ratio the original constants used) so the
            // haze look is preserved at every building size instead of
            // swallowing tall buildings whole.
            scene.fog.far = dist * 1.2;
            scene.fog.near = scene.fog.far * 0.5;

            const dir = new THREE.Vector3(1.2, 0.7, 1.5).normalize().multiplyScalar(dist);
            const toPos = dir.clone();
            toPos.y += totalHeight / 2;
            const toTarget = new THREE.Vector3(0, totalHeight / 2, 0);

            // maxDistance/far/fog above are already sized for the new
            // building, so it's safe to ease the camera there over time
            // instead of snapping -- a parameter tweak reframing the shot
            // reads as a deliberate camera move instead of a jump cut.
            tweenCameraTo(toPos, toTarget);
        }

        // --- Per-floor camera view (spec 4, Part B) -- a new sibling
        // function, not an overload of frameCameraToBuilding(): the latter
        // must keep owning the whole-building maxDistance/far/fog sizing,
        // which frameCameraToFloor() deliberately does NOT touch, so
        // returning to full view (or just manually orbiting out) never
        // fights limits that were sized for a single floor. Reuses the same
        // FOV-derived fit-distance math as frameCameraToBuilding(), applied
        // to a tight box around one floor instead of the whole height. ---
        function frameCameraToFloor(floorIndex) {
            if (!buildingGroups[floorIndex]) return;
            activeFloorIndex = floorIndex;

            const vFov = camera.fov * Math.PI / 180;
            const margin = 1.5; // a bit more headroom than the whole-building fit -- there's less context to read the shot by at this zoom
            const boxHeight = Math.max(currentStoryHeight * 2.2, 2);
            const footprint = 3.0; // slightly tighter than the whole-building footprint (3.5) -- one floor's plan, not the antenna/roof included

            const distForHeight = (boxHeight / 2) / Math.tan(vFov / 2) * margin;
            const hFov = 2 * Math.atan(Math.tan(vFov / 2) * camera.aspect);
            const distForWidth = footprint / Math.tan(hFov / 2) * margin;
            const dist = Math.max(distForHeight, distForWidth, 5);

            const floorY = buildingGroups[floorIndex].position.y; // floors only move in X/Z, so Y is safe/static to read here
            const dir = new THREE.Vector3(1.2, 0.5, 1.5).normalize().multiplyScalar(dist);
            const toPos = dir.clone();
            toPos.y += floorY;
            const toTarget = new THREE.Vector3(0, floorY, 0);

            // activeFloorIndex is already set above, so tweenCameraTo()'s own
            // scheduleAutoOrbit() call (Part D) picks up the per-floor guard
            // immediately -- no separate call needed here.
            tweenCameraTo(toPos, toTarget);
        }

        function frameCameraToFullBuilding() {
            activeFloorIndex = null;
            frameCameraToBuilding(currentTotalHeight);
        }

        // Rebuilds the View panel's floor <select> options ("Full building"
        // + "Floor 1".."Floor N") whenever the building is (re)built -- a
        // native <select> scales to 20 stories with no wrap/scroll handling
        // needed and gives free mobile touch support (spec 4, Part B).
        // Always resets the selection back to "Full building", matching
        // applyLoadedData()'s activeFloorIndex reset above.
        function populateFloorSelect(numStories) {
            if (!floorSelect) return;
            floorSelect.innerHTML = '';
            const fullOpt = document.createElement('option');
            fullOpt.value = 'full';
            fullOpt.textContent = 'Full building';
            floorSelect.appendChild(fullOpt);
            for (let f = 0; f < numStories; f++) {
                const opt = document.createElement('option');
                opt.value = String(f);
                opt.textContent = `Floor ${f + 1}`;
                floorSelect.appendChild(opt);
            }
            floorSelect.value = 'full';
        }

        // --- Camera tween: eases position/target from wherever the camera
        // currently is to a new framing over `duration` ms, instead of
        // snapping. Interrupted (not fought) by a manual drag -- see the
        // controls 'start' listener below. ---
        let cameraTween = null;

        function easeInOutCubic(t) {
            return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
        }

        function tweenCameraTo(toPos, toTarget, duration = 550) {
            cameraTween = {
                fromPos: camera.position.clone(),
                toPos: toPos.clone(),
                fromTarget: controls.target.clone(),
                toTarget: toTarget.clone(),
                start: performance.now(),
                duration,
            };
            // Guard against auto-orbit racing a camera tween (spec 4, Part
            // D) -- OrbitControls.update() reads back whatever position a
            // tween just wrote, so an autoRotate that's still active during
            // a tween would visibly fight it.
            scheduleAutoOrbit();
        }

        // --- Idle-triggered auto-orbit (spec 4, Part D) -- uses
        // OrbitControls' own built-in autoRotate/autoRotateSpeed, already
        // consumed by the existing controls.update() call in animate(), so
        // no animate-loop changes are needed beyond that. Off by default
        // while a per-floor view (Part B) is active: per-floor camera
        // distances are much tighter, so the same angular speed circles
        // faster in absolute terms and risks swinging away from the one
        // floor the user zoomed into. ---
        controls.autoRotate = false;
        controls.autoRotateSpeed = 0.5; // gentler than OrbitControls' 2.0 default
        let autoOrbitTimer = null;
        const AUTO_ORBIT_IDLE_MS = 4000;

        function scheduleAutoOrbit() {
            clearTimeout(autoOrbitTimer);
            controls.autoRotate = false;
            if (activeFloorIndex === null) {
                autoOrbitTimer = setTimeout(() => { controls.autoRotate = true; }, AUTO_ORBIT_IDLE_MS);
            }
        }

        controls.addEventListener('start', () => { cameraTween = null; scheduleAutoOrbit(); });
        controls.addEventListener('end', () => { scheduleAutoOrbit(); });
        scheduleAutoOrbit(); // arm on load

        // --- Shared by both the static out/ path (loadFolderData) and the
        // live /compute path (liveRecompute) -- builds the 3D building,
        // stores the animation data, and resets the seek bar + camera.
        // Neither data source should duplicate this. `autoScaleAmplify` is
        // true only for an actual record switch: real sway magnitude varies
        // ~500x across different earthquake records, so the zoom needs a
        // fresh default there. Building-parameter tweaks (stories/mass/
        // damping/column/beam dimensions) must NOT touch amplify -- that's
        // a separate, purely visual "zoom" the user controls, and
        // re-deriving it on every slider drag made the sway appear to
        // change for reasons unrelated to what the user just changed.
        //
        // `extra` bundles spec 5's additions: `frame` (column/beam
        // dimensions + plan span, from normalizeFrame()), `furniture`
        // (parsed per-class/per-floor decimated sway series, or null),
        // `furnitureRate` (its sample rate), `periodX`/`periodY` (for the
        // read-only T1 readout -- period is now an OUTPUT, not a slider,
        // spec C1), and `recordName` (furniture placement's seed). ---
        function applyLoadedData(numStories, storyHeight, time, groundX, groundY, floorX, floorY, extra, autoScaleAmplify = true) {
            const { frame, furniture, furnitureRate, periodX, periodY, recordName } = extra;
            const { lightSphere: light, totalHeight } = createBuilding(numStories, storyHeight, frame, recordName);
            lightSphere = light;
            createFoundationSlab();

            // Per-floor view state (spec 4, Part B) -- every rebuild (record
            // switch OR any Building Parameter change) resets to whole-
            // building view, avoiding a stale out-of-range floor index after
            // e.g. the Stories slider drops. currentTotalHeight/
            // currentStoryHeight are what frameCameraToFloor()/
            // frameCameraToFullBuilding() key off of.
            activeFloorIndex = null;
            currentTotalHeight = totalHeight;
            currentStoryHeight = numStories > 0 ? totalHeight / numStories : 0;
            repositionInteriorLights(totalHeight); // spec 4, Part C -- interior fill lights move with building height
            populateFloorSelect(numStories);

            furnitureData = furniture;
            furnitureRateHz = furnitureRate || 0;

            periodReadout.textContent = (periodX != null && periodY != null)
                ? `${periodX.toFixed(2)}s / ${periodY.toFixed(2)}s`
                : '–';

            timeData = time;
            groundXData = groundX;
            groundYData = groundY;
            floorXData = floorX;
            floorYData = floorY;
            totalFrames = time.length;
            totalDuration = timeData[timeData.length - 1] - timeData[0];
            animTime = 0;
            currentIndex = 0;

            // Peak ground displacement (not floor -- this is about the raw
            // input shaking, not the building's response) drives the
            // shake-intensity meter and camera shake. Computed unconditionally
            // (unlike the amplify auto-scale below) since it's cheap -- O(npts)
            // over the ground arrays only, not every floor -- and is a purely
            // cosmetic readout, not something a parameter tweak should be
            // allowed to silently skip updating.
            peakGroundDisp = 1e-9;
            for (let i = 0; i < groundXData.length; i++) {
                const mag = Math.hypot(groundXData[i], groundYData[i] || 0);
                if (mag > peakGroundDisp) peakGroundDisp = mag;
            }

            if (autoScaleAmplify) {
                // Peak real displacement across every floor/direction, used to
                // auto-scale the default amplify -- real sway varies ~500x
                // across different real earthquake records, so a fixed
                // default would either be invisible (small quake / stiff
                // building) or send the building flying off screen (large
                // near-fault quake / soft building) depending on what's
                // selected.
                let peakAbsDisp = 0;
                for (const series of [...floorX, ...floorY]) {
                    for (const v of series) {
                        const av = Math.abs(v);
                        if (av > peakAbsDisp) peakAbsDisp = av;
                    }
                }
                console.log(`📊 Peak floor displacement: ${(peakAbsDisp * 1000).toFixed(3)} mm`);

                if (peakAbsDisp > 1e-9) {
                    setAmplify((TARGET_SWAY_FRACTION * storyHeight) / peakAbsDisp);
                } else {
                    setAmplify(AMPLIFY_MIN);
                }
            }

            seekSlider.min = 0;
            seekSlider.max = totalDuration;
            seekSlider.value = 0;
            timeDisplay.textContent = `0.0s / ${totalDuration.toFixed(1)}s`;

            frameCameraToBuilding(totalHeight);
        }

        // --- Live recompute: POST current building-parameter sliders to
        // the Flask backend (specs/03-live-archetypes.md, extended by spec
        // 5) and re-render with the result, instead of the static out/
        // files. Binary response format: [4-byte LE header length][JSON
        // header][float32 arrays: time, X ground_disp, X floors_abs
        // (floor-major), then the same for Y if present, then furniture
        // furn_x(3xNxnpts_dec), then furn_y(...) if present] -- see
        // server.py's /compute. T1_factor is gone (spec 5 -- period is now
        // an output, not an input); column_depth_x/y and beam_depth take
        // its place. ---
        let liveAbortController = null;

        async function liveRecompute(folder, autoScaleAmplify = false) {
            if (!folder) return;
            if (liveAbortController) liveAbortController.abort();
            liveAbortController = new AbortController();
            const { signal } = liveAbortController;

            const params = {
                record: folder,
                num_stories: parseInt(storiesSlider.value, 10),
                mass_per_floor: parseFloat(massSlider.value),
                zeta: parseFloat(zetaSlider.value),
                column_depth_x: parseFloat(columnXSlider.value),
                column_depth_y: parseFloat(columnYSlider.value),
                beam_depth: parseFloat(beamSlider.value),
            };

            // Loading overlay (spec 4, Part H) -- shown for the duration of
            // the in-flight request, hidden once applyLoadedData() has run
            // below (or on error/abort). Replaces the old tiny
            // "recomputing..." text line; a superseded (aborted) request
            // simply lets the newer request's own show/hide own the
            // overlay's lifecycle instead of flickering it off here.
            recomputeOverlay.classList.add('is-active');
            try {
                const res = await fetch(COMPUTE_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(params),
                    signal,
                });
                if (!res.ok) throw new Error(`/compute failed (${res.status})`);
                const buf = await res.arrayBuffer();

                const view = new DataView(buf);
                const headerLen = view.getUint32(0, true);
                const headerJson = new TextDecoder().decode(new Uint8Array(buf, 4, headerLen));
                const header = JSON.parse(headerJson);

                // Matches the padding server.py adds so Float32Array's
                // offset (which must be a multiple of 4) always lands
                // aligned regardless of the JSON header's byte length.
                let offset = 4 + headerLen;
                offset += (4 - (offset % 4)) % 4;
                const npts = header.npts;
                const N = header.num_stories;
                function takeFloats(n) {
                    const arr = new Float32Array(buf, offset, n);
                    offset += n * 4;
                    return arr;
                }
                const time = Array.from(takeFloats(npts));
                const groundX = Array.from(takeFloats(npts));
                const floorX = [];
                for (let f = 0; f < N; f++) floorX.push(Array.from(takeFloats(npts)));

                let groundY = new Array(npts).fill(0);
                let floorY = floorX.map(() => new Array(npts).fill(0));
                if (header.has_y) {
                    groundY = Array.from(takeFloats(npts));
                    floorY = [];
                    for (let f = 0; f < N; f++) floorY.push(Array.from(takeFloats(npts)));
                }

                // Furniture -- defensively gated on the response actually
                // advertising a `furniture` block. This matters once the
                // separately-deployed backend exists: until
                // seismic-sim-backend is manually mirrored with spec 5's
                // changes (AGENTS.md's standing rule), its /compute
                // response won't have this field, and this degrades to "no
                // furniture sway" instead of throwing.
                let furniture = null;
                let furnitureRate = 0;
                if (header.furniture && header.furniture.npts_decimated) {
                    const classNames = header.furniture.classes || FURNITURE_CLASS_NAMES;
                    const nptsDec = header.furniture.npts_decimated;
                    const perAxisCount = classNames.length * N * nptsDec;
                    const furnXFlat = takeFloats(perAxisCount);
                    const furnYFlat = header.has_y ? takeFloats(perAxisCount) : null;
                    furniture = {
                        X: sliceFurnitureAxis(furnXFlat, classNames, N, nptsDec),
                        Y: furnYFlat ? sliceFurnitureAxis(furnYFlat, classNames, N, nptsDec) : {},
                    };
                    furnitureRate = header.furniture.decimated_rate_hz || 0;
                }

                applyLoadedData(header.num_stories, header.story_height, time, groundX, groundY, floorX, floorY, {
                    frame: normalizeFrame(header),
                    furniture,
                    furnitureRate,
                    periodX: header.fundamental_period_s_X ?? null,
                    periodY: header.fundamental_period_s_Y ?? null,
                    recordName: folder,
                }, autoScaleAmplify);
                recomputeOverlay.classList.remove('is-active');
                console.log(`✅ Live recompute (${folder}, N=${header.num_stories})`);
            } catch (err) {
                // A superseded (aborted) request leaves the overlay exactly
                // as it found it -- either already hidden, or still active
                // because a newer request is still in flight and owns
                // turning it off itself. Only a genuine failure needs to
                // hide it here, so it never gets stuck on indefinitely.
                if (err.name === 'AbortError') return;
                console.error('❌ Live recompute failed:', err);
                recomputeOverlay.classList.remove('is-active');
            }
        }

        // Debounce building-parameter changes so a live request only fires
        // ~200ms after the user stops moving a slider, not on every
        // intermediate value -- see specs/03-live-archetypes.md.
        let liveDebounceTimer = null;
        function scheduleLiveRecompute() {
            if (liveDebounceTimer) clearTimeout(liveDebounceTimer);
            liveDebounceTimer = setTimeout(() => {
                liveRecompute(folderSelect.value);
            }, 200);
        }

        // --- Populate dropdown ---
        async function populateFolders() {
            try {
                const res = await fetch('out/folders.json');
                if (!res.ok) throw new Error(`HTTP ${res.status}: ${res.statusText}`);
                const data = await res.json();
                const folders = data.folders || [];
                if (folders.length === 0) {
                    folderSelect.innerHTML = '<option value="">— no data —</option>';
                    return;
                }
                folderSelect.innerHTML = '';
                for (const f of folders) {
                    const opt = document.createElement('option');
                    opt.value = f;
                    opt.textContent = f;
                    folderSelect.appendChild(opt);
                }
                folderSelect.value = folders[0];
                stripRecordName.textContent = folders[0];
                await loadFolderData(folders[0]);
            } catch (err) {
                console.error('❌ Failed to load manifest:', err);
                progressEl.textContent = `⚠️ Could not load folder list: ${err.message}`;
                progressEl.style.display = 'block';
                const params = new URLSearchParams(window.location.search);
                const folderParam = params.get('folder');
                if (folderParam) {
                    folderSelect.innerHTML = `<option value="${folderParam}">${folderParam}</option>`;
                    stripRecordName.textContent = folderParam;
                    await loadFolderData(folderParam);
                }
            }
        }

        // --- Continuous fog range (bug fix) -- scene.fog.near/.far used to
        // only be recalculated at discrete framing events
        // (frameCameraToBuilding()/frameCameraToFloor()), so the instant a
        // user manually scrolled/pinched the camera further out than
        // whatever distance was last auto-framed to, the fog window stayed
        // frozen at the old (smaller) values and the building ran straight
        // into a now-too-close fixed fog wall, fading toward the
        // background the further out they went. Taller buildings made it
        // worse on top of that: a taller building needs a larger auto-fit
        // distance to begin with, and the oblique camera angle (not a
        // top-down view) spreads a tall building's base-to-roof across a
        // wider range of actual camera-relative depth than a tight fog
        // window comfortably covers, especially right after framing.
        //
        // Fixed by recomputing the fog range every frame from the camera's
        // ACTUAL current distance to controls.target, instead of a value
        // fixed at framing time. frameCameraToBuilding()/frameCameraToFloor()
        // still set an initial value (avoids a one-frame pop before the
        // first animate() tick runs), but this is the source of truth
        // thereafter -- as the camera eases through a tween, this tracks
        // right along with it, and it keeps tracking indefinitely for any
        // later manual zoom too. Slightly more generous than the original
        // framing-time ratio (0.6x/1.2x dist) on the `far` side
        // specifically, to give a tall building's oblique-angle depth
        // spread more headroom without starting the fog noticeably closer
        // to the camera.
        function updateFogRange() {
            const dist = camera.position.distanceTo(controls.target);
            scene.fog.near = dist * 0.55;
            scene.fog.far = dist * 1.6;
        }

        // --- Animation loop ---
        let lastTime = 0;

        function animate(now) {
            requestAnimationFrame(animate);

            if (cameraTween) {
                const t = Math.min(1, (now - cameraTween.start) / cameraTween.duration);
                const e = easeInOutCubic(t);
                camera.position.lerpVectors(cameraTween.fromPos, cameraTween.toPos, e);
                controls.target.lerpVectors(cameraTween.fromTarget, cameraTween.toTarget, e);
                if (t >= 1) { cameraTween = null; scheduleAutoOrbit(); }
            }

            if (!timeData.length || !buildingGroups.length) {
                controls.update();
                updateFogRange(); // resolved camera position for this frame -- see updateFogRange()'s comment above
                composer.render();
                return;
            }

            const delta = lastTime ? Math.min((now - lastTime) / 1000, 0.05) : 0.016;
            lastTime = now;

            if (isPlaying && !isSeeking) {
                animTime += delta * speed;
                if (totalDuration > 0) {
                    if (animTime > totalDuration) animTime = animTime % totalDuration;
                    const dt = (timeData[1] - timeData[0]) || 0.01;
                    const idx = Math.floor(animTime / dt);
                    currentIndex = Math.min(idx, totalFrames - 1);
                }
                seekSlider.value = animTime;
                timeDisplay.textContent = `${animTime.toFixed(1)}s / ${totalDuration.toFixed(1)}s`;
            }

            const idx = currentIndex;
            const scale = amplify;

            // Ground displacement (for the slab)
            const gx = (groundXData[idx] || 0) * scale;
            const gy = (groundYData[idx] || 0) * scale;

            // Move the foundation slab with the ground
            if (foundationSlab) {
                foundationSlab.position.x = gx;
                foundationSlab.position.z = gy;
            }

            // Update floors (their absolute positions already include
            // ground displacement). buildingGroups holds exactly numFloors
            // groups now -- the roof rides as a child of the topmost group
            // (see createBuilding()), so there's no separate "isRoof" case
            // to special-case here any more.
            for (let f = 0; f < buildingGroups.length; f++) {
                const group = buildingGroups[f];
                const fx = (floorXData[f]?.[idx] || 0) * scale;
                const fy = (floorYData[f]?.[idx] || 0) * scale;
                group.position.x = fx;
                group.position.z = fy;
            }

            // Columns span two differently-displaced levels, so their
            // transforms are re-derived every frame from the floor groups'
            // (and the foundation slab's) positions just set above -- see
            // updateColumnTransforms()'s docstring.
            updateColumnTransforms();

            // Furniture's OWN relative-sway offset (spec B), on top of
            // whatever rigid motion it already inherits from its parent
            // floor group.
            updateFurnitureOffsets(animTime);

            // Blink roof light
            if (lightSphere) {
                const blink = Math.sin(animTime * 2.3) * 0.5 + 0.5;
                lightSphere.material.emissiveIntensity = 0.4 + blink * 0.8;
            }

            // Shake-intensity meter: raw (unamplified) ground displacement
            // relative to this record's own peak, so "full bar" always means
            // "this record's strongest moment" regardless of which record or
            // Amplify setting is active.
            const rawGroundMag = Math.hypot(groundXData[idx] || 0, groundYData[idx] || 0);
            const intensity = Math.max(0, Math.min(1, rawGroundMag / peakGroundDisp));
            intensityFill.style.width = (intensity * 100).toFixed(1) + '%';

            controls.update();
            updateFogRange(); // resolved camera position for this frame, before the (reverted-after-render) shake offset below -- see updateFogRange()'s comment above animate()

            // Subtle camera shake driven by the same intensity, for a bit of
            // visceral "you are here" feedback during the strongest moments.
            // Quadratic ramp keeps it near-invisible except at genuinely high
            // intensity. Applied only to the rendered frame and reverted
            // immediately after -- OrbitControls treats camera.position as
            // ground truth on the next update(), so leaving the offset in
            // place would get baked in and drift the "official" orbit
            // position/distance frame over frame (same class of bug as the
            // damping-drift issue frameCameraToBuilding had to guard against).
            const shakeAmt = 0.06 * intensity * intensity;
            let shakeX = 0, shakeY = 0, shakeZ = 0;
            if (shakeAmt > 0.0001) {
                shakeX = Math.sin(now * 0.013) * shakeAmt;
                shakeY = Math.sin(now * 0.017 + 1.3) * shakeAmt * 0.6;
                shakeZ = Math.cos(now * 0.011 + 0.7) * shakeAmt;
                camera.position.x += shakeX;
                camera.position.y += shakeY;
                camera.position.z += shakeZ;
            }

            composer.render();

            if (shakeAmt > 0.0001) {
                camera.position.x -= shakeX;
                camera.position.y -= shakeY;
                camera.position.z -= shakeZ;
            }
        }

        // --- Event bindings ---
        // Building Parameters' own defaults -- matches out/'s precomputed
        // static files exactly (mdof_response.py's NUM_STORIES=7,
        // MDOF_ShearBuilding's own defaults, AND the new
        // COLUMN_DEPTH_X/Y/BEAM_DEPTH constants -- see the matching
        // comment at all three sites: mdof_response.py's __main__,
        // server.py's DEFAULT_*, and this file's DEFAULT_* consts above).
        // Compared via parseFloat rather than string equality so a step
        // value that round-trips differently (e.g. "1.1" vs "1.10") can't
        // silently break this fast-path check.
        function buildingParamsAtDefault() {
            return storiesSlider.value === '7'
                && massSlider.value === '1000000'
                && parseFloat(zetaSlider.value) === 0.05
                && parseFloat(columnXSlider.value) === DEFAULT_COLUMN_DEPTH_X
                && parseFloat(columnYSlider.value) === DEFAULT_COLUMN_DEPTH_Y
                && parseFloat(beamSlider.value) === DEFAULT_BEAM_DEPTH;
        }

        folderSelect.addEventListener('change', async (e) => {
            const folder = e.target.value;
            if (!folder) return;
            stripRecordName.textContent = folder;
            if (buildingParamsAtDefault()) {
                // Fast path: out/'s precomputed static files already match
                // the current (default) Building Parameters exactly.
                await loadFolderData(folder);
            } else {
                // A Building Parameter has been moved away from its
                // default -- loadFolderData would silently swap in the
                // static 7-story data while the sliders kept showing the
                // user's actual values, desyncing the displayed building
                // from what the panel claims it is. Recompute for the new
                // record with the sliders' current values instead.
                await liveRecompute(folder, true);
            }
        });

        // Shared by both the main Playback play/pause button and the
        // mobile bottom-sheet's collapsed-strip button (spec 4, Part E) --
        // one piece of state, two buttons kept in sync, instead of
        // duplicating the toggle logic.
        function togglePlayback() {
            isPlaying = !isPlaying;
            const icon = isPlaying ? '⏸' : '▶️';
            playBtn.textContent = icon;
            stripPlayBtn.textContent = icon;
        }
        playBtn.addEventListener('click', togglePlayback);
        stripPlayBtn.addEventListener('click', togglePlayback);

        // Per-floor view controls (spec 4, Part B).
        floorSelect.addEventListener('change', (e) => {
            const val = e.target.value;
            if (val === 'full') {
                frameCameraToFullBuilding();
            } else {
                frameCameraToFloor(parseInt(val, 10));
            }
        });
        backToFullViewBtn.addEventListener('click', () => {
            floorSelect.value = 'full';
            frameCameraToFullBuilding();
        });

        // Mobile bottom-sheet expand/collapse (spec 4, Part E) -- tapping
        // the collapsed strip toggles the sheet open/closed; tapping the
        // strip's own play/pause button (which bubbles up to this same
        // listener) must NOT also toggle the sheet.
        sheetStrip.addEventListener('click', (e) => {
            if (e.target.id === 'stripPlayBtn') return;
            controlsPanel.classList.toggle('sheet-collapsed');
        });
        function initSheetState() {
            if (window.innerWidth <= 600) {
                controlsPanel.classList.add('sheet-collapsed');
            } else {
                controlsPanel.classList.remove('sheet-collapsed');
            }
        }
        window.addEventListener('resize', initSheetState);
        initSheetState();

        speedSlider.addEventListener('input', (e) => {
            speed = parseFloat(e.target.value);
            speedLabel.textContent = speed.toFixed(1) + '×';
        });

        amplifySlider.addEventListener('input', (e) => {
            setAmplify(sliderPosToAmplify(parseFloat(e.target.value)));
        });

        storiesSlider.addEventListener('input', (e) => {
            storiesLabel.textContent = e.target.value;
            scheduleLiveRecompute();
        });
        massSlider.addEventListener('input', (e) => {
            massLabel.textContent = (parseFloat(e.target.value) / 1000).toFixed(0) + 't';
            scheduleLiveRecompute();
        });
        zetaSlider.addEventListener('input', (e) => {
            zetaLabel.textContent = (parseFloat(e.target.value) * 100).toFixed(1) + '%';
            scheduleLiveRecompute();
        });
        columnXSlider.addEventListener('input', (e) => {
            columnXLabel.textContent = parseFloat(e.target.value).toFixed(2) + 'm';
            scheduleLiveRecompute();
        });
        columnYSlider.addEventListener('input', (e) => {
            columnYLabel.textContent = parseFloat(e.target.value).toFixed(2) + 'm';
            scheduleLiveRecompute();
        });
        beamSlider.addEventListener('input', (e) => {
            beamLabel.textContent = parseFloat(e.target.value).toFixed(2) + 'm';
            scheduleLiveRecompute();
        });

        seekSlider.addEventListener('input', (e) => {
            isSeeking = true;
            const val = parseFloat(seekSlider.value);
            animTime = Math.min(val, totalDuration);
            if (totalDuration > 0) {
                const dt = (timeData[1] - timeData[0]) || 0.01;
                const idx = Math.floor(animTime / dt);
                currentIndex = Math.min(idx, totalFrames - 1);
            }
            timeDisplay.textContent = `${animTime.toFixed(1)}s / ${totalDuration.toFixed(1)}s`;
        });
        seekSlider.addEventListener('change', () => {
            isSeeking = false;
        });

        window.addEventListener('resize', () => {
            const w = window.innerWidth,
                h = window.innerHeight;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
            composer.setSize(w, h);
        });

        // --- Start ---
        populateFolders().catch(err => {
            console.error(err);
            progressEl.textContent = '❌ Failed to initialize.';
            progressEl.style.display = 'block';
        });

        animate(0);
    </script>
</body>
</html>
